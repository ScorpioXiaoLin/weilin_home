<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JSON 工具</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root[data-theme="dark"]{
    --bg:#0d0d0d;--bg-card:#1a1a1a;--bg-card2:#222;--bg-hover:#2a2a2a;--bg-input:#111;
    --border:#2e2e2e;--border2:#3a3a3a;--text:#f0f0f0;--text2:#999;--text3:#555;
    --accent:#4f8ef7;--accent2:#3d7ae0;--accent-bg:rgba(79,142,247,.15);
    --green:#4ade80;--yellow:#f59e0b;--purple:#a78bfa;--red:#f87171;--mark:#fde047;--mark-t:#111;
  }
  :root[data-theme="light"]{
    --bg:#f4f6f9;--bg-card:#fff;--bg-card2:#f0f2f5;--bg-hover:#eef1f5;--bg-input:#fff;
    --border:#e4e7ec;--border2:#d5d9df;--text:#1a1d21;--text2:#5c636e;--text3:#9aa1ab;
    --accent:#2f6bef;--accent2:#2457cc;--accent-bg:rgba(47,107,239,.1);
    --green:#16a34a;--yellow:#d97706;--purple:#7c3aed;--red:#dc2626;--mark:#ffe27a;--mark-t:#111;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;transition:background .25s,color .25s}
  .wrap{height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .bar h1{font-size:16px;font-weight:700;margin-right:8px}
  button{font-size:13px;font-family:inherit;border:none;cursor:pointer;border-radius:7px;padding:7px 13px;transition:.15s;background:transparent;color:var(--text2);border:1px solid var(--border2)}
  button:hover{background:var(--bg-hover);color:var(--text)}
  button.p{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
  button.p:hover{background:var(--accent2)}
  .search{margin-left:auto;display:flex;align-items:center;gap:6px}
  input[type=text]{font-family:inherit;font-size:13px;background:var(--bg-input);color:var(--text);border:1px solid var(--border2);border-radius:7px;padding:7px 10px;outline:none;width:220px}
  input:focus{border-color:var(--accent)}
  .cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .panel-h{padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:8px}
  .panel-h .stat{margin-left:auto;color:var(--text3);font-weight:400}
  #jsonInput{flex:1;width:100%;resize:none;border:0;outline:none;background:transparent;color:var(--text);padding:14px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:13px;line-height:1.7}
  .tree{flex:1;overflow:auto;padding:12px 14px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:13px;line-height:1.75}
  .err{color:var(--red);font-weight:600}
  .ok{color:var(--green)}
  .empty{color:var(--text3);padding:12px}
  /* tree */
  .jnode>.jhead{cursor:pointer;user-select:none;white-space:nowrap}
  .jtoggle{display:inline-block;width:14px;color:var(--text3);transition:transform .12s}
  .jnode.collapsed>.jtoggle,.jnode.collapsed>.jhead .jtoggle{transform:rotate(-90deg)}
  .jchildren{padding-left:20px;border-left:1px dashed var(--border);margin-left:6px}
  .jnode.collapsed>.jchildren{display:none}
  .jnode.collapsed>.jfoot{display:none}
  .jellipsis{display:none;color:var(--text3)}
  .jnode.collapsed>.jhead .jellipsis{display:inline}
  .jnode.collapsed>.jhead .jcount{display:none}
  .jkey{color:var(--accent)}
  .jbrace,.jpunc{color:var(--text2)}
  .jcount{color:var(--text3);font-size:11px}
  .jval-string{color:var(--green)}
  .jval-number{color:var(--yellow)}
  .jval-boolean{color:var(--purple)}
  .jval-null{color:var(--text3)}
  mark{background:var(--mark);color:var(--mark-t);border-radius:2px;padding:0 1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>JSON 工具</h1>
    <button class="p" onclick="format()">格式化</button>
    <button onclick="minify()">压缩</button>
    <button onclick="expandAll(true)">全部展开</button>
    <button onclick="expandAll(false)">全部收起</button>
    <button onclick="copyOut()">复制</button>
    <button onclick="clearAll()">清空</button>
    <div class="search">
      <input id="search" type="text" placeholder="搜索键或值，回车定位…" />
    </div>
  </div>
  <div class="cols">
    <div class="panel">
      <div class="panel-h">输入 <span id="inStat" class="stat"></span></div>
      <textarea id="jsonInput" spellcheck="false" placeholder='在此粘贴 JSON，例如 {"name":"张三","tags":[1,2,3]}'></textarea>
    </div>
    <div class="panel">
      <div class="panel-h">结构（点击折叠/展开） <span id="outStat" class="stat"></span></div>
      <div id="tree" class="tree"><div class="empty">在左侧粘贴 JSON…</div></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.getElementById(s);
const input=$('jsonInput'), tree=$('tree'), search=$('search');
const inStat=$('inStat'), outStat=$('outStat');
let currentData; let hasData=false;

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function el(t,c){const e=document.createElement(t);if(c)e.className=c;return e;}
function span(c,txt){const e=el('span',c);e.textContent=txt;return e;}

function build(){
  const txt=input.value;
  inStat.textContent = txt ? (txt.length+' 字符') : '';
  if(!txt.trim()){ tree.innerHTML='<div class="empty">在左侧粘贴 JSON…</div>'; outStat.textContent=''; hasData=false; return; }
  let data;
  try{ data=JSON.parse(txt); }
  catch(e){ tree.innerHTML='<div class="err">✗ 解析失败：'+esc(e.message)+'</div>'; outStat.textContent=''; hasData=false; return; }
  currentData=data; hasData=true;
  tree.innerHTML=''; tree.appendChild(renderValue(null,data));
  outStat.innerHTML='<span class="ok">✓ 合法 JSON</span>';
  applySearch();
}

function renderValue(key,value){
  const type = value===null?'null':Array.isArray(value)?'array':typeof value;
  if(type==='object'||type==='array'){
    const entries = type==='array'? value.map((v,i)=>[i,v]) : Object.entries(value);
    const open=type==='array'?'[':'{', close=type==='array'?']':'}';
    const node=el('div','jnode');
    const head=el('div','jhead');
    head.appendChild(span('jtoggle','▾'));
    if(key!==null){ const k=span('jkey',JSON.stringify(key)); k.dataset.raw=k.textContent; head.appendChild(k); head.appendChild(span('jpunc',': ')); }
    head.appendChild(span('jbrace',open));
    head.appendChild(span('jcount',' '+entries.length+' 项 '));
    head.appendChild(span('jellipsis',' … '+close));
    const children=el('div','jchildren');
    entries.forEach(([k,v])=>children.appendChild(renderValue(k,v)));
    const foot=el('div','jfoot'); foot.appendChild(span('jbrace',close));
    node.appendChild(head); node.appendChild(children); node.appendChild(foot);
    head.addEventListener('click',()=>node.classList.toggle('collapsed'));
    return node;
  }
  const row=el('div','jleaf');
  if(key!==null){ const k=span('jkey',JSON.stringify(key)); k.dataset.raw=k.textContent; row.appendChild(k); row.appendChild(span('jpunc',': ')); }
  const v=span('jval jval-'+type, type==='string'?JSON.stringify(value):String(value));
  v.dataset.raw=v.textContent;
  row.appendChild(v);
  return row;
}

function expandAll(open){ document.querySelectorAll('.jnode').forEach(n=>n.classList.toggle('collapsed',!open)); }

function applySearch(){
  const q=search.value.trim().toLowerCase();
  let first=null;
  document.querySelectorAll('.jkey,.jval').forEach(node=>{
    const raw=node.dataset.raw||node.textContent;
    if(!q){ node.innerHTML=esc(raw); return; }
    const i=raw.toLowerCase().indexOf(q);
    if(i>=0){
      node.innerHTML=esc(raw.slice(0,i))+'<mark>'+esc(raw.slice(i,i+q.length))+'</mark>'+esc(raw.slice(i+q.length));
      let p=node.parentElement;
      while(p){ if(p.classList&&p.classList.contains('jnode')) p.classList.remove('collapsed'); p=p.parentElement; }
      if(!first) first=node;
    } else { node.innerHTML=esc(raw); }
  });
  if(first) first.scrollIntoView({block:'center',behavior:'smooth'});
}

function format(){ if(!ensure())return; input.value=JSON.stringify(currentData,null,2); build(); }
function minify(){ if(!ensure())return; input.value=JSON.stringify(currentData); build(); }
function ensure(){ build(); return hasData; }
function copyOut(){ if(!hasData)return; navigator.clipboard.writeText(input.value); }
function clearAll(){ input.value=''; search.value=''; build(); }

input.addEventListener('input',build);
search.addEventListener('input',applySearch);
search.addEventListener('keydown',e=>{ if(e.key==='Enter') applySearch(); });
build();
</script>
<script>
window.addEventListener('message',function(e){if(e.data&&e.data.type==='yb-theme'){document.documentElement.setAttribute('data-theme',e.data.theme==='light'?'light':'dark');}});
</script>
</body>
</html>
