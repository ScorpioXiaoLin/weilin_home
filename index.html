<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>简易工具台</title>
<link rel="stylesheet" href="common.css" />
<style>
  /* 首页外壳专属额外变量（侧栏底色、阴影、辉光） */
  :root[data-theme="dark"]{--bg-side:#141414;--shadow:0 24px 60px rgba(0,0,0,.5);--glow:rgba(79,142,247,.22)}
  :root[data-theme="light"]{--bg-side:#ffffff;--shadow:0 20px 50px rgba(60,80,120,.14);--glow:rgba(47,107,239,.14)}
  html,body{height:100%}
  a{color:inherit;text-decoration:none}

  .layout{display:flex;min-height:100vh}

  /* ===== 左侧导航 ===== */
  .side{
    width:248px;flex-shrink:0;background:var(--bg-side);border-right:1px solid var(--border);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:transform .25s,background .25s;z-index:20;
  }
  .brand{padding:22px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--purple));
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
  .brand-t b{font-size:15px;font-weight:800;display:block;letter-spacing:-.2px}
  .brand-t span{font-size:11px;color:var(--text3)}

  .nav{flex:1;overflow-y:auto;padding:14px 12px}
  .nav-label{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--text2);
    cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.14s;border:1px solid transparent}
  .nav-item:hover{background:var(--bg-hover);color:var(--text)}
  .nav-item.active{background:var(--accent-bg);color:var(--accent);border-color:transparent;font-weight:600}
  .nav-item .ni-ico{width:20px;text-align:center;font-size:15px;flex-shrink:0}
  .nav-item .ni-t{flex:1}
  .nav-item .soon{font-size:10px;color:var(--text3);border:1px solid var(--border);border-radius:99px;padding:1px 7px}

  .side-foot{padding:14px 18px;border-top:1px solid var(--border);color:var(--text3);font-size:11.5px}

  /* ===== 右侧主区 ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:60px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg);
    display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:15;transition:background .25s}
  .hamb{display:none;background:transparent;border:1px solid var(--border);color:var(--text2);
    width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px}
  .crumb{font-size:15px;font-weight:700;flex:1}
  .crumb small{display:block;font-size:11.5px;color:var(--text3);font-weight:400}
  .top-actions{display:flex;align-items:center;gap:10px}
  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--text2);cursor:pointer;
    width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .icon-btn:hover{background:var(--bg-hover);color:var(--text);border-color:var(--border2)}
  .icon-btn svg{width:18px;height:18px}
  .open-new{font-size:12.5px;color:var(--text2);border:1px solid var(--border);border-radius:9px;
    padding:0 14px;height:38px;display:none;align-items:center;gap:6px;transition:.15s}
  .open-new:hover{background:var(--bg-hover);color:var(--text)}

  .content{flex:1;position:relative;overflow:auto}

  /* ===== 首页视图 ===== */
  .home{padding:44px 40px 60px;position:relative;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .home::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,var(--glow),transparent 70%);filter:blur(70px);top:-140px;right:-60px;z-index:0;pointer-events:none}
  .home-inner{position:relative;z-index:1;max-width:920px}
  .badge{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--accent-bg);
    color:var(--accent);font-size:12px;font-weight:600;border:1px solid var(--border);margin-bottom:18px}
  .home h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
  .home h1 .grad{background:linear-gradient(90deg,var(--accent),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
  .home .sub{color:var(--text2);font-size:15px;margin:14px 0 0;max-width:560px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:38px}
  .dcard{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:20px;
    cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .dcard:hover{border-color:var(--border2);transform:translateY(-4px);box-shadow:var(--shadow)}
  .dcard.soon{cursor:default;opacity:.7}
  .dcard.soon:hover{transform:none;box-shadow:none;border-color:var(--border)}
  .dcard .ico{width:44px;height:44px;border-radius:11px;background:var(--accent-bg);
    display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:14px}
  .dcard h3{font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .dcard p{color:var(--text2);font-size:13px}
  .dcard .go{margin-top:14px;font-size:13px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px}
  .tag-soon{font-size:10px;color:var(--text3);border:1px solid var(--border);border-radius:99px;padding:1px 8px;font-weight:500}

  /* 首页浮动预览示意 */
  .hint{margin-top:40px;display:flex;align-items:center;gap:10px;color:var(--text3);font-size:12.5px}

  /* ===== iframe 视图 ===== */
  .frame-view{position:absolute;inset:0;display:none;animation:fade .35s ease}
  .frame-view.show{display:block}
  .frame-view iframe{width:100%;height:100%;border:0;background:var(--bg)}

  /* 占位（coming soon）视图 */
  .placeholder{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    color:var(--text3);text-align:center;padding:40px;animation:fade .35s ease}
  .placeholder.show{display:flex}
  .placeholder .p-ico{font-size:46px;margin-bottom:16px}
  .placeholder h2{font-size:20px;color:var(--text);font-weight:700;margin-bottom:8px}
  .placeholder p{font-size:14px;max-width:360px}

  /* 遮罩（移动端侧栏） */
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}

  @media(max-width:820px){
    .side{position:fixed;left:0;top:0;transform:translateX(-100%)}
    .side.open{transform:none}
    .scrim.show{display:block}
    .hamb{display:flex;align-items:center;justify-content:center}
    .home{padding:32px 20px 50px}
  }
</style>
</head>
<body>
<div class="layout">

  <!-- 左侧导航 -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">WL</div>
      <div class="brand-t"><b>简易工具台</b><span>Demo & 工具集</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">导航</div>
      <div class="nav-item active" data-id="home"><span class="ni-ico">🏠</span><span class="ni-t">首页</span></div>
      <div class="nav-label">演示 / 工具</div>
      <div id="nav-demos"></div>
    </nav>
    <div class="side-foot">简易工具台 · v2.0</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- 右侧主区 -->
  <div class="main">
    <header class="topbar">
      <button class="hamb" id="hamb">☰</button>
      <div class="crumb" id="crumb">首页<small id="crumb-sub">选择左侧的演示开始</small></div>
      <div class="top-actions">
        <a class="open-new" id="openNew" target="_blank" rel="noopener">↗ 新窗口打开</a>
        <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题"></button>
      </div>
    </header>

    <div class="content">
      <!-- 首页 -->
      <section class="home" id="homeView">
        <div class="home-inner">
          <span class="badge">V2.2</span>
          <h1>工具、演示<span class="grad">工作台</span></h1>
          <p class="sub">集中管理各类静态演示与工具。从左侧选择，或点击下方卡片进入对应 demo。</p>

          <div class="cards" id="cards"></div>

          <!-- <div class="hint">💡 新增 demo 只需在源码顶部的 <code>DEMOS</code> 数组里加一项即可。</div> -->
        </div>
      </section>

      <!-- iframe 演示 -->
      <section class="frame-view" id="frameView">
        <iframe id="frame" title="demo" referrerpolicy="no-referrer"></iframe>
      </section>

      <!-- 占位 -->
      <section class="placeholder" id="placeholder">
        <div class="p-ico">🚧</div>
        <h2 id="ph-title">即将上线</h2>
        <p id="ph-desc">该演示正在开发中，敬请期待。</p>
      </section>
    </div>
  </div>
</div>

<script>
/* ========== 在这里维护你的所有 demo ==========
   ready:true  → 点击后在右侧 iframe 加载 file
   ready:false → 显示“即将上线”占位  */
const DEMOS = [
  { id:'json',       title:'JSON 工具', desc:'解析 / 格式化 / 压缩 / 折叠展开 / 搜索高亮，左右对照。', icon:'📋', file:'tools/json.html', ready:true },
  { id:'timestamp',  title:'时间戳转换', desc:'时间戳与日期互转，支持时区、单位切换与批量转换。', icon:'⏱️', file:'tools/timestamp.html', ready:true },
  { id:'imagegen',   title:'图片生成', desc:'Canvas 绘制数字/文字，自定义内容与画布尺寸、预设字号，文字位置预设/坐标与越界提示，支持序列批量生成并打包 PNG。', icon:'🖼️', file:'tools/imagegen.html', ready:true },
  { id:'regex',      title:'正则提取', desc:'粘贴文本按正则提取/高亮/替换，含表达式校验、常用表达式库，并可由示例内容反向生成正则。', icon:'🔍', file:'tools/regex.html', ready:true },
  { id:'random',     title:'随机字符串', desc:'按字符类型与长度生成随机字符串，支持排除相似字符、更改自动生成与最近生成记录。', icon:'🎲', file:'tools/random.html', ready:true },
  { id:'calculator', title:'佣金计算器', desc:'分销关系链分层佣金测算，支持 V1/V2/V3 阻断与团队流水规则。', icon:'💰', file:'tools/calculator.html', ready:true },
  { id:'more',       title:'更多工具', desc:'后续新增的静态演示都会出现在这里。', icon:'✨', file:'', ready:false },
];

const $ = s => document.querySelector(s);
const navDemos = $('#nav-demos'), cards = $('#cards');
const homeView = $('#homeView'), frameView = $('#frameView'), placeholder = $('#placeholder');
const frame = $('#frame'), crumb = $('#crumb'), crumbSub = $('#crumb-sub'), openNew = $('#openNew');
const side = $('#side'), scrim = $('#scrim');

/* 构建左侧导航 + 首页卡片 */
DEMOS.forEach(d=>{
  const item = document.createElement('div');
  item.className = 'nav-item'; item.dataset.id = d.id;
  item.innerHTML = `<span class="ni-ico">${d.icon}</span><span class="ni-t">${d.title}</span>${d.ready?'':'<span class="soon">待上线</span>'}`;
  item.onclick = ()=>go(d.id);
  navDemos.appendChild(item);

  const card = document.createElement('div');
  card.className = 'dcard' + (d.ready?'':' soon');
  card.innerHTML = `<div class="ico">${d.icon}</div>
    <h3>${d.title} ${d.ready?'':'<span class="tag-soon">待上线</span>'}</h3>
    <p>${d.desc}</p>
    ${d.ready?'<div class="go">进入 →</div>':''}`;
  card.onclick = ()=>go(d.id);
  cards.appendChild(card);
});

function setActive(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.id===id));
}
function showView(which){
  homeView.style.display = which==='home' ? '' : 'none';
  frameView.classList.toggle('show', which==='frame');
  placeholder.classList.toggle('show', which==='placeholder');
}

function go(id){
  closeSide();
  if(id==='home'){
    setActive('home'); showView('home');
    crumb.childNodes[0].nodeValue='首页'; crumbSub.textContent='选择左侧的演示开始';
    openNew.style.display='none';
    history.replaceState(null,'','#');
    return;
  }
  const d = DEMOS.find(x=>x.id===id);
  if(!d){ go('home'); return; }
  setActive(id);
  crumb.childNodes[0].nodeValue = d.title;
  crumbSub.textContent = d.desc;
  history.replaceState(null,'','#'+id);
  if(d.ready && d.file){
    if(frame.getAttribute('src')!==d.file) frame.setAttribute('src', d.file);
    openNew.href = d.file; openNew.style.display='inline-flex';
    showView('frame');
  }else{
    $('#ph-title').textContent = d.title + ' · 即将上线';
    $('#ph-desc').textContent = d.desc;
    openNew.style.display='none';
    showView('placeholder');
  }
}

/* 顶部首页导航项点击 */
document.querySelector('.nav-item[data-id="home"]').onclick = ()=>go('home');

/* ===== 主题切换 ===== */
const root = document.documentElement, themeBtn = $('#themeBtn');
const ICON = {
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>'
};
function syncFrame(t){                       // 把主题广播给右侧 iframe 内的 demo
  try{ frame.contentWindow && frame.contentWindow.postMessage({type:'yb-theme', theme:t}, '*'); }catch(e){}
}
function applyTheme(t){
  root.setAttribute('data-theme', t);
  themeBtn.innerHTML = t==='dark' ? ICON.sun : ICON.moon; // 暗色时显示太阳（点击切亮）
  localStorage.setItem('yb-theme', t);
  syncFrame(t);
}
themeBtn.onclick = ()=>applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');
applyTheme(localStorage.getItem('yb-theme') || 'dark');
frame.addEventListener('load', ()=>syncFrame(root.getAttribute('data-theme'))); // iframe 换页后同步当前主题

/* ===== 移动端侧栏 ===== */
function openSide(){ side.classList.add('open'); scrim.classList.add('show'); }
function closeSide(){ side.classList.remove('open'); scrim.classList.remove('show'); }
$('#hamb').onclick = openSide; scrim.onclick = closeSide;

/* ===== 深链 / 初始路由 ===== */
go((location.hash||'').replace('#','') || 'home');
window.addEventListener('hashchange', ()=>go((location.hash||'').replace('#','')||'home'));
</script>
</body>
</html>
